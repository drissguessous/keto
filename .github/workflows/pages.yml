# Publie la version web (iPhone / tout navigateur) : copie app/assets/www vers la branche gh-pages,
# servie par GitHub Pages (Settings → Pages → Deploy from a branch → gh-pages).
name: Version web (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ["app/assets/www/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier avant publication
        run: |
          set -e
          cd app/assets/www
          for f in index.html app.js styles.css content.js recipes.js photo-keywords.js sw.js manifest.webmanifest icon.png icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do
            test -s "$f" || { echo "Fichier manquant : $f"; exit 1; }
          done
          for f in app.js content.js recipes.js photo-keywords.js sw.js; do node --check "$f"; done
          python3 -c "import json; json.load(open('manifest.webmanifest'))"
      - name: Copier la version web sur gh-pages
        run: |
          set -e
          mkdir /tmp/site && cp -r app/assets/www/. /tmp/site/ && touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Publish web version from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
